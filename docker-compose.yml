name: community-hub

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: communityhub
      POSTGRES_PASSWORD: communityhub
      POSTGRES_DB: communityhub
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U communityhub -d communityhub"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://communityhub:communityhub@db:5432/communityhub?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-a-48-byte-random-hex-string}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      UPLOAD_DIR: ./uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      SMS_FROM: ${SMS_FROM:-CommunityHub}
      KNOCK_API_KEY: ${KNOCK_API_KEY:-}
      KNOCK_SMS_WORKFLOW: ${KNOCK_SMS_WORKFLOW:-phone-verification}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
    volumes:
      - uploads:/app/backend/uploads

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  postgres-data:
  uploads:
